<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 팀 자율좌석제 배치도</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    <h1>🏢 우리 팀 오늘 어디 앉았지?</h1>
    <p class="subtitle">좌석을 클릭해서 본인 이름을 등록하세요. (매일 밤 12시 초기화)</p>
    <p class="subtitle subtitle-accent">다른 사람이 검색할 수 있도록 이름은 영어-소문자로 입력해주세요!</p>
    <p class="subtitle subtitle-last">자리 맡는 용도가 아닙니다! 팀원에게 자신의 위치를 공유하기 위한 사이트입니다.</p>
    <div class="search-bar-container">
      <input type="text" id="searchInput" placeholder="팀원 이름 입력 (영어 소문자)">
      <button id="searchBtn">🔍</button>
    </div>
    <div class="map-container" id="mapContainer">
      <div class="room" data-room="meeting-1">distruptive</div>
      <div class="room" data-room="meeting-2">Honest</div>
      <div class="room" data-room="meeting-3">사물함</div>
      <div class="room" data-room="meeting-4">Open</div>
      <div class="room" data-room="meeting-5">Team player</div>
      <div class="room" data-room="meeting-6">Pride</div>
      <div class="room" data-room="meeting-7">사물함</div>
      <div class="room" data-room="meeting-8">Tenecious</div>
      <div class="room" data-room="meeting-9">AI</div>
      <div class="room" data-room="meeting-10">FUN</div>
      <div id="searchOverlay" class="search-overlay" style="display: none;"></div>
      
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
